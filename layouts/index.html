<!DOCTYPE html>
<html lang="en">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": "ZeroGen Lab",
  "url": "https://zerogenlab.github.io/",
  "logo": "https://zerogenlab.github.io/img/logo/ZEROGENLAB_LOGO.png",
  "description": "ZeroGen Lab: Exploring GenAI with a from-zero mindset.",
  "sameAs": [
    "https://github.com/zerogenlab"
  ]
}
</script>

<head>
    {{- partial "head.html" . -}}
    <meta name="description" content="{{ .Site.Params.homepage_meta_tags.meta_og_description }}" />
    <meta property="og:title" content="{{ .Site.Params.homepage_meta_tags.meta_og_title }}" />
    <meta property="og:type" content="{{ .Site.Params.homepage_meta_tags.meta_og_type }}" />
    <meta property="og:url" content="{{ .Site.Params.homepage_meta_tags.meta_og_url }}" />
    <meta property="og:image" content="{{ .Site.Params.homepage_meta_tags.meta_og_image }}" />
    <meta property="og:description" content="{{ .Site.Params.homepage_meta_tags.meta_og_description }}" />
</head>

<body class="flex flex-col h-screen of-auto">
    <main class="flex-1">
        {{- partial "alert.html" . -}}
        {{- partial "header.html" . -}}
        <div class="scroll-top rounded-full">
            <span class="icon-keyboard_arrow_up text-2xl"></span>
        </div>
        {{- partial "slide.html" . -}}
        {{- partial "strip.html" . -}}
        {{ if ne .Site.Params.showBlog false }}
        <div class="my-10">
            <div class="container mx-auto max-w-7xl">
                <div class="mx-2 flex-1">
                {{- partial "recent.html" . -}}
                </div>
            </div>
        </div>
        {{ end }}
    </main>
    {{- partial "footer.html" . -}}
    <script src="{{ "/js/swiper-bundle.min.js" | relURL }}"></script>
    <script>
        var mySwiper = new Swiper(".swiper-container", {
            direction: "horizontal",
            loop: true,
            speed: 550,
            autoplay: {
                delay: 6000,
            },
            pagination: {
                el: ".swiper-pagination",
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>

</html>
